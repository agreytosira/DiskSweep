[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-sweep"
version = "0.1.0"
description = "Scan, inspect, and selectively clean disk space from your terminal."
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8,<9",
    "send2trash>=2.1,<3",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
disk-sweep = "disk_sweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disk_sweep = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
